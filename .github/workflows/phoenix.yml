name: Enterprise PhoenixTest AI Automation Agent

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-phoenix-agent:
    name: Execute Autonomous Self-Healing Test Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      - name: Configure Python Execution Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Enterprise Automation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic

      - name: Execute Live AI Self-Healing Diagnostics
        run: python phoenix_agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
